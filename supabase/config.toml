# Supabase local dev configuration — https://supabase.com/docs/guides/cli

[api]
enabled     = true
port        = 54321
schemas     = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows    = 1000

[db]
port        = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port    = 54323

[inbucket]
enabled = true
port    = 54324

[storage]
enabled = true

[auth]
enabled                  = true
site_url                 = "http://localhost:3000"
additional_redirect_urls = ["https://app.vitaltrack.health"]
jwt_expiry               = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval  = 10
enable_signup            = true
minimum_password_length  = 12
password_requirements    = "letters_digits"

[auth.email]
enable_signup           = true
double_confirm_changes  = true
enable_confirmations    = true

[auth.mfa]
max_enrolled_factors = 5

[auth.mfa.totp]
enroll_enabled   = true
verify_enabled   = true

[analytics]
enabled = false
